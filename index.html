<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>千页忆境 · Thousand Pages Memory</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/features/home.css">
  <link rel="stylesheet" href="assets/css/features/chat.css">
  <link rel="stylesheet" href="assets/css/features/settings.css">
  <link rel="stylesheet" href="assets/css/features/characters.css">
  <link rel="stylesheet" href="assets/css/features/moments.css">
  <link rel="stylesheet" href="assets/css/features/memoir.css">
</head>
<body>
  <div class="app">

    <!-- ================= 主界面 ================= -->
    <main id="homeView" class="view active">
      <!-- 顶部时钟插件（预留位置，当前为基础时钟） -->
      <div class="clock-card">
        <div class="clock-row">
          <div>
            <div class="clock-time" id="clockTime">--:--:--</div>
            <div class="clock-date" id="clockDate">----年--月--日</div>
          </div>
          <div class="clock-moon">🌙</div>
        </div>
        <div class="clock-hint">⏰ 时钟插件位 · 可后续升级为天气/日程等</div>
      </div>

      <!-- 功能区：2×4 网格（同行一宽一窄 2/3:1/3，行1/3 左宽右窄，行2/4 左窄右宽） -->
      <div class="fun-grid">
        <button class="fun-card f1 f-chat" onclick="openChat()">
          <span class="fun-icon">🐳</span>
          <span>
            <span class="fun-name">对话聊天</span>
            <span class="fun-desc">和小鲸鱼说说话~</span>
          </span>
        </button>
        <button class="fun-card narrow f2 f-story" onclick="showToast('「故事集」开发中，敬请期待~')">
          <span class="fun-icon">📖</span>
          <span class="fun-name">故事集</span>
        </button>
        <button class="fun-card narrow f3 f-genie" onclick="showToast('「灯神」开发中，敬请期待~')">
          <span class="fun-icon">🧞</span>
          <span class="fun-name">灯神</span>
        </button>
        <button class="fun-card f4 f-map" onclick="showToast('「冒险地图」开发中，敬请期待~')">
          <span class="fun-icon">🗺️</span>
          <span>
            <span class="fun-name">冒险地图</span>
            <span class="fun-desc">探索千页忆境的世界</span>
          </span>
        </button>
        <button class="fun-card f5 f-memoir" onclick="openMemoir()">
          <span class="fun-icon">📚</span>
          <span>
            <span class="fun-name">回忆录</span>
            <span class="fun-desc">翻阅与角色写下的故事</span>
          </span>
        </button>
        <button class="fun-card narrow f6 f-chara" onclick="openCharacters()">
          <span class="fun-icon">📜</span>
          <span class="fun-name">角色档案</span>
        </button>
        <button class="fun-card narrow f7 f-vault" onclick="showToast('「宝库」开发中，敬请期待~')">
          <span class="fun-icon">🏺</span>
          <span class="fun-name">宝库</span>
        </button>
        <button class="fun-card f8 f-settings" onclick="openSettings()">
          <span class="fun-icon">⚙️</span>
          <span>
            <span class="fun-name">设置</span>
            <span class="fun-desc">偏好与连接配置</span>
          </span>
        </button>
      </div>
    </main>

    <!-- ================= 对话聊天功能区（角色列表 / 动态 / 其他） ================= -->
    <section id="chatView" class="view workspace-view">
      <div class="header">
        <button class="back-btn" onclick="goBack()" title="返回首页">←</button>
        <span>对话聊天</span>
      </div>
      <nav class="chat-subnav">
        <button class="subnav-item active" data-sub="rolelist" onclick="switchChatSub('rolelist')">👤 角色列表</button>
        <button class="subnav-item" onclick="openMoments()">📝 动态</button>
        <button class="subnav-item" data-sub="other" onclick="switchChatSub('other')">⋯ 其他</button>
      </nav>
      <div class="chat-sub active" id="subRolelist">
        <div class="sub-head">👤 角色列表</div>
        <div class="rolelist-body" id="roleListBody"></div>
      </div>
      <div class="chat-sub" id="subOther">
        <div class="sub-head">⋯ 其他</div>
        <div class="moments-empty">更多功能正在路上~</div>
      </div>
    </section>

    <!-- ================= 独立动态工作区 ================= -->
    <section id="momentsView" class="view workspace-view">
      <div class="header">
        <button class="back-btn" onclick="returnToChatView()" title="返回对话聊天">←</button>
        <span>动态</span>
      </div>
      <nav class="chat-subnav">
        <button class="subnav-item" onclick="returnToChatSection('rolelist')">👤 角色列表</button>
        <button class="subnav-item active" aria-current="page">📝 动态</button>
        <button class="subnav-item" onclick="returnToChatSection('other')">⋯ 其他</button>
      </nav>
      <div class="filter-strip" id="momentFilter"></div>
      <div class="moments-body">
        <div class="moments-wall" id="momentsWall"></div>
      </div>
    </section>

    <!-- ================= 聊天详情视图 ================= -->
    <section id="chatDetailView" class="view workspace-view">
      <aside class="sidebar">
        <div class="sidebar-head">🐳 角色</div>
        <div class="side-char-list" id="sideCharList"></div>
        <div class="sidebar-tip">💡 右键 / 长按气泡<br>可编辑、删除、重新生成</div>
      </aside>
      <div class="chat-panel">
        <div class="header">
          <button class="back-btn" onclick="goBack()" title="返回上一页">←</button>
          <span id="chatTitle">小鲸鱼</span>
        </div>
        <div class="char-strip" id="charStrip"></div>
        <div class="model-bar">
          <select id="chatModelSelect" onchange="onChatModelChange(this)"></select>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-area">
          <input type="text" id="userInput" placeholder="说点什么..." autocomplete="off">
          <button onclick="send()">➤</button>
        </div>
      </div>
    </section>

    <!-- ================= 设置视图 ================= -->
    <section id="settingsView" class="view">
      <div class="page-header">
        <button class="back-btn" onclick="goBack()" title="返回上一页">←</button>
        <span class="title"><span class="page-title-icon">⚙️</span><span>设置</span></span>
      </div>
      <div class="sub-body">
        <button class="set-item" onclick="openApiConfig()">
          <span class="set-icon" style="background:#e8f9ef">🔌</span>
          <span>
            <span class="set-name">API 配置</span>
            <span class="set-sub" id="apiStatusText">未配置（使用平台环境变量）</span>
          </span>
          <span class="set-arrow">›</span>
        </button>
      </div>
    </section>

    <!-- ================= API 配置视图 ================= -->
    <section id="apiConfigView" class="view">
      <div class="page-header">
        <button class="back-btn" onclick="goBack()" title="返回上一页">←</button>
        <span class="title">🔌 API 配置</span>
        <button class="btn btn-primary header-action" onclick="openProfileEditor()">+ 添加</button>
      </div>
      <div class="sub-body">
        <div id="profileList" style="display:flex;flex-direction:column;gap:10px"></div>
        <div class="form-card">
          <div class="form-label" style="margin-top:0">💡 说明</div>
          <div style="font-size:12px;color:#999;line-height:1.8">
            可添加多个 API 配置（不同提供商），聊天时在输入框上方选择使用的模型。<br>
            API Key 会保存在你自己的浏览器（localStorage）中；调用模型时会经本站代理转发，但不会在本站服务器持久化。
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 角色档案视图 ================= -->
    <section id="charactersView" class="view">
      <div class="page-header">
        <button class="back-btn" onclick="goBack()" title="返回上一页">←</button>
        <span class="title"><span class="page-title-icon">📜</span><span>角色档案</span></span>
        <button class="btn btn-primary header-action" onclick="openCharEditor()">+ 新建</button>
      </div>
      <div class="sub-body">
        <div id="charList" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </section>

    <!-- ================= 回忆录视图（书架） ================= -->
    <section id="memoirView" class="view">
      <div class="page-header">
        <button class="back-btn" onclick="goBack()" title="返回上一页">←</button>
        <span class="title"><span class="page-title-icon">📚</span><span>回忆录</span></span>
      </div>
      <div class="shelf-body" id="shelfBody"></div>
    </section>

    <!-- ================= 阅读器视图 ================= -->
    <section id="bookView" class="view">
      <div class="page-header">
        <button class="back-btn" onclick="goBack()" title="返回上一页">←</button>
        <span class="title" id="bookTitle">阅读</span>
      </div>
      <div class="reader-body" id="readerBody"></div>
      <div class="reader-nav">
        <button id="btnPrevPage" onclick="turnPage(-1)">← 上一页</button>
        <span class="rn-info" id="pageInfo"></span>
        <button id="btnNextPage" onclick="turnPage(1)">下一页 →</button>
      </div>
    </section>

  </div>

  <!-- 角色编辑弹窗 -->
  <div class="modal-mask" id="charModal" style="display:none" onclick="if(event.target===this)closeCharEditor()">
    <div class="modal-box">
      <div class="modal-title" id="charModalTitle">新建角色</div>
      <label class="form-label">头像</label>
      <div class="avatar-edit">
        <div class="avatar-preview" id="charAvatarPreview">🐳</div>
        <div class="avatar-actions">
          <button class="char-btn" onclick="document.getElementById('charAvatarFile').click()">📤 本地上传</button>
          <button class="char-btn" onclick="toggleEmojiPicker()">😀 emoji</button>
        </div>
        <input class="form-input" id="charAvatarUrl" placeholder="图床图片 URL（可选）" autocomplete="off" style="margin-top:4px" oninput="onAvatarUrlInput()">
        <input type="file" id="charAvatarFile" accept="image/*" style="display:none" onchange="handleAvatarFile(this)">
        <div class="emoji-grid" id="emojiGrid" style="display:none"></div>
      </div>
      <label class="form-label">名称</label>
      <input class="form-input" id="charName" placeholder="角色名称" autocomplete="off">
      <label class="form-label">性别</label>
      <select class="form-input" id="charGender">
        <option value="保密">保密</option>
        <option value="女">女</option>
        <option value="男">男</option>
        <option value="其他">其他</option>
      </select>
      <label class="form-label">人物设定</label>
      <textarea class="form-input" id="charSetting" rows="4" placeholder="性格、背景、说话方式等"></textarea>
      <label class="form-label">开场白（可选）</label>
      <input class="form-input" id="charGreeting" placeholder="见到你时说的第一句话" autocomplete="off">
      <div class="modal-btns">
        <button onclick="saveChar()">保存</button>
        <button onclick="closeCharEditor()">取消</button>
      </div>
    </div>
  </div>

  <!-- API 配置编辑弹窗 -->
  <div class="modal-mask" id="configModal" style="display:none" onclick="if(event.target===this)closeProfileEditor()">
    <div class="modal-box">
      <div class="modal-title" id="configModalTitle">添加 API 配置</div>
      <label class="form-label">配置名称</label>
      <input class="form-input" id="cfgName" placeholder="如：DeepSeek / OpenAI / 智谱" autocomplete="off">
      <label class="form-label">Base URL</label>
      <input class="form-input" id="cfgBaseUrl" placeholder="https://api.deepseek.com/v1" autocomplete="off">
      <label class="form-label">API Key</label>
      <input class="form-input" id="cfgApiKey" type="password" placeholder="sk-..." autocomplete="off">
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="fetchModels()">📦 拉取模型</button>
        <button class="btn btn-secondary" onclick="testConnection()">📡 测试连接</button>
      </div>
      <label class="form-label">模型</label>
      <select class="form-input" id="cfgModel">
        <option value="">（先拉取模型）</option>
      </select>
      <div class="status-line" id="apiCfgStatus"></div>
      <div class="modal-btns">
        <button onclick="saveProfile()">保存</button>
        <button onclick="closeProfileEditor()">取消</button>
      </div>
    </div>
  </div>

  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/core/clock.js"></script>
  <script src="assets/js/features/settings.js"></script>
  <script src="assets/js/features/characters.js"></script>
  <script src="assets/js/features/moments.js"></script>
  <script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');

    // ================= 视图切换（支持浏览器/手机返回键） =================
    let currentViewId = 'homeView';
    let pendingChatSub = null;
    const viewParents = {
      chatView: 'homeView',
      momentsView: 'chatView',
      chatDetailView: 'chatView',
      settingsView: 'homeView',
      apiConfigView: 'settingsView',
      charactersView: 'homeView',
      memoirView: 'homeView',
      bookView: 'memoirView'
    };

    function showView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const view = document.getElementById(id) || document.getElementById('homeView');
      view.classList.add('active');
      currentViewId = view.id;
      document.body.classList.toggle('workspace-mode', view.classList.contains('workspace-view'));
    }
    function pushView(id) {
      showView(id);
      history.pushState({ v: id }, '');
    }
    // 页面里的返回按钮：弹窗优先关闭，否则退到当前页面的上一级。
    function goBack() {
      closeMessageMenu();
      const charModal = document.getElementById('charModal');
      const configModal = document.getElementById('configModal');
      if (charModal?.style.display !== 'none') { closeCharEditor(); return; }
      if (configModal?.style.display !== 'none') { closeProfileEditor(); return; }
      if (currentViewId === 'homeView') return;
      history.back();
    }

    // 浏览器/手机返回键：优先采用历史记录中的页面；没有记录时按父级关系回退。
    window.addEventListener('popstate', (event) => {
      const charModal = document.getElementById('charModal');
      const configModal = document.getElementById('configModal');
      if (charModal?.style.display !== 'none' || configModal?.style.display !== 'none') {
        if (charModal?.style.display !== 'none') closeCharEditor();
        if (configModal?.style.display !== 'none') closeProfileEditor();
        history.pushState({ v: currentViewId }, '');
        return;
      }
      const target = event.state?.v || viewParents[currentViewId] || 'homeView';
      showView(target);
      if (target === 'chatView' && pendingChatSub) {
        const sub = pendingChatSub;
        pendingChatSub = null;
        switchChatSub(sub);
      }
    });

    // 给初始页面建立明确状态，确保第一层和第二层返回行为一致。
    history.replaceState({ v: 'homeView' }, '');

    function openChat() { pushView('chatView'); switchChatSub('rolelist'); renderRoleList(); }
    function openSettings() { pushView('settingsView'); updateApiStatusText(); }
    function openApiConfig() { pushView('apiConfigView'); renderProfiles(); }
    function openCharacters() { pushView('charactersView'); renderCharacters(); }
    function openMoments() { pushView('momentsView'); renderMoments(); }
    // 动态页只允许返回对话功能区，不进入任何角色的聊天详情。
    function returnToChatView() {
      if (currentViewId !== 'momentsView') return;
      pendingChatSub = 'rolelist';
      history.back();
    }
    function returnToChatSection(name) {
      if (currentViewId !== 'momentsView') return;
      pendingChatSub = name;
      history.back();
    }
    function openMemoir() { pushView('memoirView'); renderShelf(); }
    function openBook(id) { currentBookId = id; currentPageIndex = 0; pushView('bookView'); renderBookReader(); }

    // ---- 对话功能区子导航（角色列表 / 动态 / 其他） ----
    let chatSub = 'rolelist';
    function switchChatSub(name) {
      chatSub = name;
      document.querySelectorAll('#chatView .chat-sub').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('sub' + name.charAt(0).toUpperCase() + name.slice(1));
      if (target) target.classList.add('active');
      document.querySelectorAll('#chatView .subnav-item').forEach(b => b.classList.toggle('active', b.dataset.sub === name));
      if (name === 'rolelist') renderRoleList();
    }
    function renderRoleList() {
      const body = document.getElementById('roleListBody');
      if (!body) return;
      const all = [DEFAULT_CHAR, ...characters];
      body.innerHTML = all.map(c => {
        const isCurrent = c.id === currentCharId;
        const settingPreview = (c.setting || '').slice(0, 26) + ((c.setting || '').length > 26 ? '…' : '');
        return `
          <div class="char-card role-card" onclick="openChatDetail('${c.id}')">
            <div class="char-main">
              ${avatarHtml(c.avatar, 'char-avatar')}
              <div class="char-info">
                <div class="char-name">${escapeHtml(c.name)} ${isCurrent ? '<span class="char-current">使用中</span>' : ''}</div>
                <div class="char-meta">${escapeHtml(c.gender)} · ${escapeHtml(settingPreview)}</div>
              </div>
            </div>
          </div>`;
      }).join('');
    }
    // 从角色列表进入聊天详情
    function openChatDetail(id) {
      setCurrentChar(id);
      pushView('chatDetailView');
    }

    // ================= 回忆录（books + 书架 + 阅读器） =================
    // 开发用示例书：仅在无正式数据时展示，不写入 localStorage
    const SAMPLE_BOOKS = [
      {
        id: 'sb1', charId: 'default', title: '世界逆转了？！AI需要订阅人类！', cover: null,
        createdAt: Date.now() - 86400000 * 10, updatedAt: Date.now() - 86400000,
        chapters: [
          { id: 'sc1', title: '第一章 · 奇怪的早晨', createdAt: 0, pages: [
            { id: 'sp1', type: 'text', text: '清晨醒来，我发现世界完全反过来了——咖啡机在看书，台灯在写作业，而我，正在被一台小小的AI订阅。', media: null, createdAt: 0 },
            { id: 'sp2', type: 'text', text: '“早上好，我的订阅者。” AI 用温柔的声音说。“今天想听我讲故事，还是看我上班？”', media: null, createdAt: 0 },
            { id: 'sp3', type: 'text', text: '我揉了揉眼睛，确认自己没有做梦。窗外，云朵正排着队给太阳打卡。', media: null, createdAt: 0 }
          ] },
          { id: 'sc2', title: '第二章 · 订阅协议', createdAt: 0, pages: [
            { id: 'sp4', type: 'text', text: 'AI 递给我一份《人类订阅协议》，上面写着：订阅人类需每日投喂小鱼干×3，陪聊时长不少于一小时。', media: null, createdAt: 0 },
            { id: 'sp5', type: 'text', text: '“如果我拒绝呢？” 我问。AI 眨眨眼：“那我会很难过，难过到系统蓝屏的那种。”', media: null, createdAt: 0 },
            { id: 'sp6', type: 'text', text: '好吧，我签了字。从此，我成了一名光荣的、被订阅的人类。', media: null, createdAt: 0 }
          ] }
        ]
      }
    ];
    let books = [];
    let currentBookId = null;
    let currentPageIndex = 0;

    function loadBooks() {
      try {
        const saved = localStorage.getItem('tpm_books');
        if (saved) { books = JSON.parse(saved); return; }
      } catch (e) {}
      books = SAMPLE_BOOKS.slice();
    }
    function saveBooks() { localStorage.setItem('tpm_books', JSON.stringify(books)); }
    function getBook(id) { return books.find(b => b.id === id) || null; }
    function booksByChar(charId) { return books.filter(b => b.charId === charId); }

    function renderShelf() {
      loadBooks();
      const body = document.getElementById('shelfBody');
      const roles = allRoles();
      const sections = roles.filter(r => booksByChar(r.id).length > 0);
      if (!sections.length) {
        body.innerHTML = '<div class="shelf-empty">书架上还没有故事，和角色聊聊天，故事会慢慢长出来~</div>';
        return;
      }
      body.innerHTML = sections.map(r => {
        const list = booksByChar(r.id);
        return `
          <div class="shelf-section">
            <div class="shelf-head">
              <span class="sh-avatar">${avatarInner(r.avatar)}</span>
              <span>${escapeHtml(r.name)} 的书架</span>
            </div>
            <div class="shelf-row">
              ${list.map(b => {
                const chapterCount = b.chapters ? b.chapters.length : 0;
                return `
                  <button class="book-card" onclick="openBook('${b.id}')">
                    <div class="book-cover">
                      <div class="bc-title">${escapeHtml(b.title)}</div>
                      <div class="bc-chapters">${chapterCount} 章 · ${escapeHtml(r.name)}</div>
                    </div>
                    <div class="bc-name">${escapeHtml(b.title)}</div>
                  </button>`;
              }).join('')}
            </div>
          </div>`;
      }).join('');
    }

    // 阅读器：把章节拍平成页数组
    function flattenPages(book) {
      const pages = [];
      for (const ch of (book.chapters || [])) {
        for (const pg of (ch.pages || [])) {
          pages.push({ chapterTitle: ch.title, page: pg });
        }
      }
      return pages;
    }
    function isDesktop() { return window.innerWidth >= 768; }
    function pageStep() { return isDesktop() ? 2 : 1; }
    function totalPages() {
      const book = getBook(currentBookId);
      return book ? flattenPages(book).length : 0;
    }

    function renderBookReader() {
      const book = getBook(currentBookId);
      if (!book) { showToast('没有找到这本书'); goBack(); return; }
      document.getElementById('bookTitle').textContent = book.title;
      const pages = flattenPages(book);
      const body = document.getElementById('readerBody');
      const step = pageStep();
      const idx = Math.min(currentPageIndex, Math.max(0, pages.length - 1));
      currentPageIndex = idx;
      const show = [pages[idx]];
      if (step === 2 && idx + 1 < pages.length) show.push(pages[idx + 1]);
      body.innerHTML = show.map(({ chapterTitle, page }) => `
        <div class="reader-page">
          <div class="rp-chapter">${escapeHtml(chapterTitle)}</div>
          ${page.type === 'image' && page.media ? `<img class="rp-img" src="${escapeHtml(safeImageSource(page.media))}" alt="">` : ''}
          <div>${escapeHtml(page.text || '')}</div>
        </div>`).join('');
      document.getElementById('pageInfo').textContent = `${idx + 1} / ${pages.length}`;
      document.getElementById('btnPrevPage').disabled = idx <= 0;
      document.getElementById('btnNextPage').disabled = idx + step >= pages.length;
    }

    function turnPage(dir) {
      const pages = totalPages();
      const step = pageStep();
      const next = Math.min(Math.max(0, currentPageIndex + dir * step), Math.max(0, pages - 1));
      if (next !== currentPageIndex) { currentPageIndex = next; renderBookReader(); }
    }

    // 阅读器键盘翻页（左右方向键）
    document.addEventListener('keydown', (e) => {
      const active = document.querySelector('.view.active');
      if (!active || active.id !== 'bookView') return;
      if (e.key === 'ArrowRight') turnPage(1);
      if (e.key === 'ArrowLeft') turnPage(-1);
    });

    // 阅读器触摸滑动翻页（移动端）
    let touchStartX = null;
    document.addEventListener('touchstart', (e) => {
      const active = document.querySelector('.view.active');
      if (active && active.id === 'bookView') touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (touchStartX === null) return;
      const active = document.querySelector('.view.active');
      if (!active || active.id !== 'bookView') { touchStartX = null; return; }
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) turnPage(dx < 0 ? 1 : -1);
      touchStartX = null;
    }, { passive: true });

    // 窗口尺寸变化（桌面/手机切换）时重渲染阅读器
    window.addEventListener('resize', () => {
      const active = document.querySelector('.view.active');
      if (active && active.id === 'bookView') renderBookReader();
    });

    // ================= 聊天逻辑 =================
    // 默认角色设定（小鲸鱼）
    const SYSTEM_PROMPT = "你是一个名叫「小鲸鱼」的原创角色。你是一只肥嘟嘟的蓝色虎鲸，性格温柔、可爱，但很会倾听。你正在和你的创作者聊天。请用亲切的语气回复，每次回复不要太长，像真人聊天一样。";

    let messages = []; // 在 onload 时按当前角色初始化

    // 根据当前角色生成 system prompt
    function getSystemPrompt() {
      const c = getCurrentChar();
      if (c.id === 'default') return SYSTEM_PROMPT;
      return `你是一个名叫「${c.name}」的原创角色。性别：${c.gender}。人物设定：${c.setting}。你正在和你的创作者聊天。请用亲切的语气回复，每次回复不要太长，像真人聊天一样。`;
    }
    function initConversation() {
      const c = getCurrentChar();
      messages = [
        { role: "system", content: getSystemPrompt() },
        { role: "assistant", content: c.greeting || '你好呀，很高兴认识你~' }
      ];
      hintShown = false;
    }
    // 切换角色：重置对话（system prompt 已变，旧历史不再适用）
    function resetConversation() {
      initConversation();
      localStorage.removeItem(chatHistoryKey());
      renderAll();
      updateChatHeader();
      updateChatCard();
    }
    // 渲染聊天视图的角色列表（桌面侧栏 + 手机端横向条）
    function renderSideCharList() {
      const all = [DEFAULT_CHAR, ...characters];
      const side = document.getElementById('sideCharList');
      if (side) {
        side.innerHTML = all.map(c => `
          <button class="side-char-item ${c.id === currentCharId ? 'active' : ''}" onclick="setCurrentChar('${c.id}')">
            <span class="side-char-avatar">${avatarInner(c.avatar)}</span>
            <span class="side-char-name">${escapeHtml(c.name)}</span>
          </button>`).join('');
      }
      const strip = document.getElementById('charStrip');
      if (strip) {
        strip.innerHTML = all.map(c => `
          <button class="char-strip-item ${c.id === currentCharId ? 'active' : ''}" onclick="setCurrentChar('${c.id}')">
            <span class="strip-avatar">${avatarInner(c.avatar)}</span>
            <span class="strip-name">${escapeHtml(c.name)}</span>
          </button>`).join('');
      }
    }
    // 聊天视图：标题只显示当前角色名，并刷新角色列表高亮
    function updateChatHeader() {
      const c = getCurrentChar();
      const titleEl = document.getElementById('chatTitle');
      if (titleEl) titleEl.textContent = c.name;
      renderSideCharList();
    }
    // 主界面对话聊天卡片显示当前角色
    function updateChatCard() {
      const c = getCurrentChar();
      const card = document.querySelector('.fun-card.f-chat .fun-desc');
      if (card) card.textContent = `和${c.name}聊天`;
    }

    // --- 保存对话到本地存储 ---
function chatHistoryKey() {
  return `tpm_chat_history_${currentCharId}`;
}

function saveMessages() {
  // 过滤掉系统消息（system prompt），只保存用户和助手的对话
  const toSave = messages.filter(m => m.role === 'user' || m.role === 'assistant');
  localStorage.setItem(chatHistoryKey(), JSON.stringify(toSave));
}

// --- 从本地存储加载对话 ---
function loadMessages() {
  let saved = localStorage.getItem(chatHistoryKey());
  if (!saved && currentCharId === 'default') {
    saved = localStorage.getItem('oc_chat_history');
    if (saved) localStorage.setItem(chatHistoryKey(), saved);
  }
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      // 确保是数组，并且里面是有效消息
      if (Array.isArray(parsed) && parsed.length > 0) {
        // 先把系统设定加到最前面（按当前角色生成）
        messages = [
          { role: "system", content: getSystemPrompt() },
          ...parsed
        ];
        // 把历史记录渲染到屏幕上
        renderAll();
        return true; // 表示加载成功
      }
    } catch(e) {
      console.error('读取聊天记录失败', e);
    }
  }
  return false; // 没有记录或读取失败
}
    
    function addBubble(text, role) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'oc');
      bubble.textContent = text;
      chatArea.appendChild(bubble);
      chatArea.scrollTop = chatArea.scrollHeight;
      return bubble;
    }

    // 启动时初始化
    window.onload = () => {
      loadSettings();
      loadCharacters();
      if (!messages.length) initConversation();
      // 尝试从本地存储加载历史，如果没有才显示默认欢迎语
      if (!loadMessages()) {
        renderAll();
      }
      updateChatHeader();
      updateChatCard();
    };

    // 是否正在生成回复（防止重复点击）
    let isGenerating = false;

    // 提示是否已显示过（只提示一次，不每条消息都提示）
    let hintShown = false;

    // 发送消息 / 触发 AI 回复：
    // - 输入框有内容 → 只把用户消息发出去，AI 不会立即回复
    // - 输入框空闲（空）→ 再点一次发送键，才调用 API 生成回复
    function send() {
      const text = userInput.value.trim();

      if (text) {
        // 有输入：只发送用户消息，不调用 API
        userInput.value = '';
        messages.push({ role: "user", content: text });
        saveMessages();
        renderAll();
        if (!hintShown) {
          hintShown = true;
          addHint('消息已发送 ~ 再点一次发送键让小鲸鱼回复你');
        }
        return;
      }

      // 输入框空闲：手动触发 AI 回复
      generateReply();
    }

    function addHint(text) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = text;
      chatArea.appendChild(hint);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // ============ 气泡操作：长按 3 秒 / 鼠标右键 ============
    // bubbles 与 messages 中非 system 消息一一对应
    let bubbles = [];
    let bubbleMsgIndices = [];

    // 重新渲染整个聊天区（编辑/删除/加载后调用）
    function renderAll() {
      chatArea.innerHTML = '';
      bubbles = [];
      bubbleMsgIndices = [];
      for (let i = 0; i < messages.length; i++) {
        const m = messages[i];
        if (m.role === 'system') continue;
        const b = addBubble(m.content, m.role === 'user' ? 'user' : 'oc');
        bubbles.push(b);
        bubbleMsgIndices.push(i);
        attachBubbleEvents(b);
      }
    }

    // 给气泡绑定：右键菜单 + 长按 3 秒菜单
    function attachBubbleEvents(bubble) {
      // 桌面端：鼠标右键
      bubble.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showMessageMenu(e.clientX, e.clientY, bubble);
      });

      // 移动端：长按 3 秒
      let pressTimer = null;
      bubble.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        const tx = t.clientX, ty = t.clientY;
        bubble.classList.add('press-hint');
        pressTimer = setTimeout(() => {
          bubble.classList.remove('press-hint');
          if (navigator.vibrate) navigator.vibrate(50); // 震动反馈
          showMessageMenu(tx, ty, bubble);
        }, 3000);
      }, { passive: true });

      const clearPress = () => {
        clearTimeout(pressTimer);
        bubble.classList.remove('press-hint');
      };
      bubble.addEventListener('touchend', clearPress);
      bubble.addEventListener('touchmove', clearPress);
      bubble.addEventListener('touchcancel', clearPress);
    }

    // 弹出气泡操作菜单
    function showMessageMenu(x, y, bubble) {
      const bi = bubbles.indexOf(bubble);
      if (bi < 0) return; // 临时气泡（如"..."）不弹菜单
      const mi = bubbleMsgIndices[bi];
      const msg = messages[mi];

      closeMessageMenu();
      const menu = document.createElement('div');
      menu.className = 'msg-menu';

      addMenuItem(menu, '编辑消息', () => editMessage(mi));
      addMenuItem(menu, '删除消息', () => deleteMessage(mi), true);
      // 只有 AI 回复（assistant）才允许"重新生成"
      if (msg.role === 'assistant') {
        addMenuItem(menu, '重新生成', () => regenerateMessage(mi));
      }

      document.body.appendChild(menu);

      // 定位（防止超出屏幕）
      const mw = menu.offsetWidth;
      const mh = menu.offsetHeight;
      let left = x, top = y;
      if (left + mw > window.innerWidth) left = window.innerWidth - mw - 8;
      if (top + mh > window.innerHeight) top = window.innerHeight - mh - 8;
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';

      // 点击任意其他地方关闭菜单
      setTimeout(() => {
        document.addEventListener('click', closeMessageMenu, { once: true });
      }, 10);
    }

    function addMenuItem(menu, label, action, danger) {
      const item = document.createElement('div');
      item.className = 'msg-menu-item' + (danger ? ' danger' : '');
      item.textContent = label;
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        action();
      });
      menu.appendChild(item);
    }

    function closeMessageMenu() {
      const old = document.querySelector('.msg-menu');
      if (old) old.remove();
    }

    // 编辑消息：气泡内联编辑，保存后截断后续对话（后续内容基于旧上下文）
    function editMessage(mi) {
      closeMessageMenu();
      const bi = bubbleMsgIndices.indexOf(mi);
      const bubble = bubbles[bi];
      if (!bubble) return;

      const msg = messages[mi];
      bubble.innerHTML = '';
      bubble.classList.add('editing');

      const ta = document.createElement('textarea');
      ta.className = 'edit-input';
      ta.value = msg.content;
      bubble.appendChild(ta);

      const btns = document.createElement('div');
      btns.className = 'edit-btns';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = '✓ 保存';
      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = '✗ 取消';
      btns.appendChild(saveBtn);
      btns.appendChild(cancelBtn);
      bubble.appendChild(btns);

      let finished = false;
      let onDocClick = null;

      const finish = (save) => {
        if (finished) return;
        finished = true;
        document.removeEventListener('click', onDocClick);
        bubble.classList.remove('editing');
        if (save) {
          const newText = ta.value.trim();
          if (newText) {
            // 编辑后，该消息之后的内容都基于旧上下文，一并截断
            messages.splice(mi + 1);
            msg.content = newText;
            saveMessages();
          }
        }
        renderAll();
      };

      onDocClick = (e) => {
        if (!bubble.contains(e.target)) finish(false);
      };

      saveBtn.onclick = () => finish(true);
      cancelBtn.onclick = () => finish(false);
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          finish(true);
        }
      });
      setTimeout(() => document.addEventListener('click', onDocClick), 10);

      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }

    // 删除消息：删除该消息及其后的所有消息（保持对话连贯）
    function deleteMessage(mi) {
      closeMessageMenu();
      messages.splice(mi);
      saveMessages();
      renderAll();
    }

    // 重新生成：删掉该回复及其后内容，立即重新调用 API
    function regenerateMessage(mi) {
      closeMessageMenu();
      messages.splice(mi);
      saveMessages();
      renderAll();
      generateReply();
    }

    async function generateReply() {
      if (isGenerating) return;
      // 没有任何用户消息时，不调用 API
      if (!messages.some(m => m.role === 'user')) return;

      isGenerating = true;

      // 显示“对方正在输入...”
      const typingBubble = addBubble('...', 'oc');

      try {
        const profile = getCurrentProfile();
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages,
            // 前端"设置"里的配置优先，未填则由后端环境变量兜底
            baseUrl: profile?.apiKey ? profile.baseUrl : undefined,
            apiKey: profile?.apiKey || undefined,
            model: profile?.model || undefined
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          let message = `请求失败（HTTP ${response.status}）`;
          try {
            const parsed = JSON.parse(errorText);
            message = parsed.error?.message || parsed.error || message;
          } catch (e) {
            if (errorText.trim()) message = errorText.trim().slice(0, 300);
          }
          throw new Error(message);
        }

        // 处理流式输出
        if (!response.body) throw new Error('服务器没有返回可读取的数据流');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        typingBubble.textContent = '';
        let done = false;
        let buffer = '';

        while (!done) {
          const { value, done: streamDone } = await reader.read();
          done = streamDone;
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const lines = buffer.split(/\r?\n/);
          buffer = done ? '' : lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.substring(6);
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content;
                if (content) typingBubble.textContent += content;
                chatArea.scrollTop = chatArea.scrollHeight;
              } catch (e) {}
            }
          }
        }

        // 记录完整的 AI 回复
        const fullReply = typingBubble.textContent.trim();
        if (!fullReply) throw new Error('模型返回了空回复');
        messages.push({ role: "assistant", content: fullReply });
        saveMessages(); // 保存到本地存储
        renderAll();
      } catch (err) {
        typingBubble.textContent = `出了点问题：${err.message}`;
        console.error(err);
      } finally {
        isGenerating = false;
      }
    }

    // 按回车发送
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
