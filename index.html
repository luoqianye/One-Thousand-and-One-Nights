<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>一千零一夜</title>
  <style>
    /* ============ 响应式布局：手机全屏 / 桌面分栏 ============ */
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(160deg, #dceefc 0%, #c3e0f7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; justify-content: center; align-items: center;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;              /* 手机端：全屏 */
      background: #ededed;
      overflow: hidden;
    }

    /* 桌面端：居中圆角卡片 + 分栏 */
    @media (min-width: 768px) {
      body { padding: 4vh 24px; }
      .app {
        max-width: 920px;
        height: min(92vh, 780px);
        border-radius: 22px;
        box-shadow: 0 24px 80px rgba(30, 60, 110, 0.25);
      }
    }

    /* ---- 左侧角色卡（仅桌面显示） ---- */
    .sidebar { display: none; }
    @media (min-width: 768px) {
      .sidebar {
        display: flex; flex-direction: column;
        width: 250px; flex-shrink: 0;
        background: linear-gradient(180deg, #2e6fb5 0%, #1c4f92 100%);
        color: #fff; padding: 28px 20px 20px;
      }
      .oc-avatar {
        width: 84px; height: 84px; border-radius: 50%;
        background: #fff; font-size: 44px;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 14px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      }
      .oc-name { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
      .oc-tag {
        font-size: 12px; background: rgba(255,255,255,0.18);
        border-radius: 999px; padding: 3px 12px;
        margin: 0 auto 16px; display: inline-block; align-self: center;
      }
      .oc-desc {
        font-size: 13px; line-height: 1.7; color: rgba(255,255,255,0.92);
        background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px;
      }
      .sidebar-tip {
        margin-top: auto; font-size: 12px; color: rgba(255,255,255,0.65);
        text-align: center; line-height: 1.7;
      }
    }

    /* ---- 右侧聊天面板 ---- */
    .chat-panel {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      background: #ededed;
    }
    .header {
      background: #ededed; padding: 14px 16px; text-align: center;
      border-bottom: 1px solid #d5d5d5; font-weight: bold; font-size: 16px;
      color: #333;
    }
    .chat-area {
      flex: 1; padding: 12px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 18px;
      line-height: 1.4; word-break: break-word; animation: fadeIn 0.2s;
      -webkit-touch-callout: none;
    }
    @media (min-width: 768px) { .bubble { max-width: 70%; } }
    .user { align-self: flex-end; background: #95d469; color: #000; border-bottom-right-radius: 4px; }
    .oc { align-self: flex-start; background: #fff; color: #000; border-bottom-left-radius: 4px; }
    .input-area {
      display: flex; padding: 10px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: #f7f7f7; border-top: 1px solid #d5d5d5;
    }
    .input-area input {
      flex: 1; border: 1px solid #ccc; border-radius: 20px;
      padding: 10px 15px; outline: none; font-size: 16px; background: #fff;
    }
    .input-area button {
      margin-left: 8px; background: #07c160; color: white; border: none;
      border-radius: 50%; width: 40px; height: 40px; font-size: 20px;
      cursor: pointer; flex-shrink: 0;
    }

    .hint { text-align: center; font-size: 12px; color: #999; margin: 4px 0; }
    .bubble.press-hint { box-shadow: 0 0 0 2px #07c160; }
    .bubble.editing { border: 2px solid #07c160; }
    .msg-menu {
      position: fixed; z-index: 1000; background: #fff; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25); padding: 6px 0; min-width: 130px;
    }
    .msg-menu-item { padding: 10px 16px; font-size: 14px; color: #333; cursor: pointer; }
    .msg-menu-item:active { background: #f0f0f0; }
    .msg-menu-item.danger { color: #e64340; }
    .edit-input {
      width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px;
      padding: 6px 8px; font-size: 14px; font-family: inherit; resize: none;
      min-height: 40px; background: #fff; color: #000;
    }
    .edit-btns { display: flex; gap: 6px; margin-top: 6px; }
    .edit-btns button { flex: 1; border: none; border-radius: 8px; padding: 6px 0; font-size: 12px; cursor: pointer; }
    .edit-btns button:first-child { background: #07c160; color: #fff; }
    .edit-btns button:last-child { background: #eee; color: #333; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="oc-avatar">🐳</div>
      <div class="oc-name">小鲸鱼</div>
      <div class="oc-tag">原创角色 · OC</div>
      <div class="oc-desc">一只肥嘟嘟的蓝色虎鲸，性格温柔、可爱，但很会倾听。此刻正等着和你聊天呢~</div>
      <div class="sidebar-tip">💡 右键 / 长按气泡<br>可编辑、删除、重新生成</div>
    </aside>
    <main class="chat-panel">
      <div class="header">💬 和小鲸鱼聊天</div>
      <div class="chat-area" id="chatArea"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="说点什么..." autocomplete="off">
        <button onclick="send()">➤</button>
      </div>
    </main>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');

    // 在这里修改你的 OC 设定！想改成谁都行。
    const SYSTEM_PROMPT = "你是一个名叫「小鲸鱼」的原创角色。你是一只肥嘟嘟的蓝色虎鲸，性格温柔、可爱，但很会倾听。你正在和你的创作者聊天。请用亲切的语气回复，每次回复不要太长，像真人聊天一样。";

    let messages = [
      { role: "system", content: SYSTEM_PROMPT },
      { role: "assistant", content: "你好呀，我是小鲸鱼。很高兴能和你聊天~ 今天想聊什么呢？" }
    ];

    // --- 保存对话到本地存储 ---
function saveMessages() {
  // 过滤掉系统消息（system prompt），只保存用户和助手的对话
  const toSave = messages.filter(m => m.role === 'user' || m.role === 'assistant');
  localStorage.setItem('oc_chat_history', JSON.stringify(toSave));
}

// --- 从本地存储加载对话 ---
function loadMessages() {
  const saved = localStorage.getItem('oc_chat_history');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      // 确保是数组，并且里面是有效消息
      if (Array.isArray(parsed) && parsed.length > 0) {
        // 先把系统设定加到最前面
        messages = [
          { role: "system", content: SYSTEM_PROMPT },
          ...parsed
        ];
        // 把历史记录渲染到屏幕上
        renderAll();
        return true; // 表示加载成功
      }
    } catch(e) {
      console.error('读取聊天记录失败', e);
    }
  }
  return false; // 没有记录或读取失败
}
    
    function addBubble(text, role) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'oc');
      bubble.textContent = text;
      chatArea.appendChild(bubble);
      chatArea.scrollTop = chatArea.scrollHeight;
      return bubble;
    }

    // 启动时显示第一条 OC 消息
    window.onload = () => {
  // 尝试从本地存储加载历史，如果没有才显示默认欢迎语
  if (!loadMessages()) {
    renderAll();
  }
};

    // 是否正在生成回复（防止重复点击）
    let isGenerating = false;

    // 提示是否已显示过（只提示一次，不每条消息都提示）
    let hintShown = false;

    // 发送消息 / 触发 AI 回复：
    // - 输入框有内容 → 只把用户消息发出去，AI 不会立即回复
    // - 输入框空闲（空）→ 再点一次发送键，才调用 API 生成回复
    function send() {
      const text = userInput.value.trim();

      if (text) {
        // 有输入：只发送用户消息，不调用 API
        userInput.value = '';
        messages.push({ role: "user", content: text });
        saveMessages();
        renderAll();
        if (!hintShown) {
          hintShown = true;
          addHint('消息已发送 ~ 再点一次发送键让小鲸鱼回复你');
        }
        return;
      }

      // 输入框空闲：手动触发 AI 回复
      generateReply();
    }

    function addHint(text) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = text;
      chatArea.appendChild(hint);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // ============ 气泡操作：长按 3 秒 / 鼠标右键 ============
    // bubbles 与 messages 中非 system 消息一一对应
    let bubbles = [];
    let bubbleMsgIndices = [];

    // 重新渲染整个聊天区（编辑/删除/加载后调用）
    function renderAll() {
      chatArea.innerHTML = '';
      bubbles = [];
      bubbleMsgIndices = [];
      for (let i = 0; i < messages.length; i++) {
        const m = messages[i];
        if (m.role === 'system') continue;
        const b = addBubble(m.content, m.role === 'user' ? 'user' : 'oc');
        bubbles.push(b);
        bubbleMsgIndices.push(i);
        attachBubbleEvents(b);
      }
    }

    // 给气泡绑定：右键菜单 + 长按 3 秒菜单
    function attachBubbleEvents(bubble) {
      // 桌面端：鼠标右键
      bubble.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showMessageMenu(e.clientX, e.clientY, bubble);
      });

      // 移动端：长按 3 秒
      let pressTimer = null;
      bubble.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        const tx = t.clientX, ty = t.clientY;
        bubble.classList.add('press-hint');
        pressTimer = setTimeout(() => {
          bubble.classList.remove('press-hint');
          if (navigator.vibrate) navigator.vibrate(50); // 震动反馈
          showMessageMenu(tx, ty, bubble);
        }, 3000);
      }, { passive: true });

      const clearPress = () => {
        clearTimeout(pressTimer);
        bubble.classList.remove('press-hint');
      };
      bubble.addEventListener('touchend', clearPress);
      bubble.addEventListener('touchmove', clearPress);
      bubble.addEventListener('touchcancel', clearPress);
    }

    // 弹出气泡操作菜单
    function showMessageMenu(x, y, bubble) {
      const bi = bubbles.indexOf(bubble);
      if (bi < 0) return; // 临时气泡（如"..."）不弹菜单
      const mi = bubbleMsgIndices[bi];
      const msg = messages[mi];

      closeMessageMenu();
      const menu = document.createElement('div');
      menu.className = 'msg-menu';

      addMenuItem(menu, '编辑消息', () => editMessage(mi));
      addMenuItem(menu, '删除消息', () => deleteMessage(mi), true);
      // 只有 AI 回复（assistant）才允许"重新生成"
      if (msg.role === 'assistant') {
        addMenuItem(menu, '重新生成', () => regenerateMessage(mi));
      }

      document.body.appendChild(menu);

      // 定位（防止超出屏幕）
      const mw = menu.offsetWidth;
      const mh = menu.offsetHeight;
      let left = x, top = y;
      if (left + mw > window.innerWidth) left = window.innerWidth - mw - 8;
      if (top + mh > window.innerHeight) top = window.innerHeight - mh - 8;
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';

      // 点击任意其他地方关闭菜单
      setTimeout(() => {
        document.addEventListener('click', closeMessageMenu, { once: true });
      }, 10);
    }

    function addMenuItem(menu, label, action, danger) {
      const item = document.createElement('div');
      item.className = 'msg-menu-item' + (danger ? ' danger' : '');
      item.textContent = label;
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        action();
      });
      menu.appendChild(item);
    }

    function closeMessageMenu() {
      const old = document.querySelector('.msg-menu');
      if (old) old.remove();
    }

    // 编辑消息：气泡内联编辑，保存后截断后续对话（后续内容基于旧上下文）
    function editMessage(mi) {
      closeMessageMenu();
      const bi = bubbleMsgIndices.indexOf(mi);
      const bubble = bubbles[bi];
      if (!bubble) return;

      const msg = messages[mi];
      bubble.innerHTML = '';
      bubble.classList.add('editing');

      const ta = document.createElement('textarea');
      ta.className = 'edit-input';
      ta.value = msg.content;
      bubble.appendChild(ta);

      const btns = document.createElement('div');
      btns.className = 'edit-btns';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = '✓ 保存';
      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = '✗ 取消';
      btns.appendChild(saveBtn);
      btns.appendChild(cancelBtn);
      bubble.appendChild(btns);

      let finished = false;
      let onDocClick = null;

      const finish = (save) => {
        if (finished) return;
        finished = true;
        document.removeEventListener('click', onDocClick);
        bubble.classList.remove('editing');
        if (save) {
          const newText = ta.value.trim();
          if (newText) {
            // 编辑后，该消息之后的内容都基于旧上下文，一并截断
            messages.splice(mi + 1);
            msg.content = newText;
            saveMessages();
          }
        }
        renderAll();
      };

      onDocClick = (e) => {
        if (!bubble.contains(e.target)) finish(false);
      };

      saveBtn.onclick = () => finish(true);
      cancelBtn.onclick = () => finish(false);
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          finish(true);
        }
      });
      setTimeout(() => document.addEventListener('click', onDocClick), 10);

      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }

    // 删除消息：删除该消息及其后的所有消息（保持对话连贯）
    function deleteMessage(mi) {
      closeMessageMenu();
      messages.splice(mi);
      saveMessages();
      renderAll();
    }

    // 重新生成：删掉该回复及其后内容，立即重新调用 API
    function regenerateMessage(mi) {
      closeMessageMenu();
      messages.splice(mi);
      saveMessages();
      renderAll();
      generateReply();
    }

    async function generateReply() {
      if (isGenerating) return;
      // 没有任何用户消息时，不调用 API
      if (!messages.some(m => m.role === 'user')) return;

      isGenerating = true;

      // 显示“对方正在输入...”
      const typingBubble = addBubble('...', 'oc');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) throw new Error('请求失败');

        // 处理流式输出
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        typingBubble.textContent = '';
        let done = false;

        while (!done) {
          const { value, done: streamDone } = await reader.read();
          done = streamDone;
          const chunk = decoder.decode(value, { stream: !done });
          // 简单解析 SSE 数据行
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.substring(6);
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content;
                if (content) typingBubble.textContent += content;
                chatArea.scrollTop = chatArea.scrollHeight;
              } catch (e) {}
            }
          }
        }

        // 记录完整的 AI 回复
        const fullReply = typingBubble.textContent;
        messages.push({ role: "assistant", content: fullReply });
        saveMessages(); // 保存到本地存储
        renderAll();
      } catch (err) {
        typingBubble.textContent = '出了点问题，晚点再试试吧...';
        console.error(err);
      } finally {
        isGenerating = false;
      }
    }

    // 按回车发送
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
