<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OC 聊天室</title>
  <style>
    /* 手机外壳样式 */
    body { margin: 0; background: #2c2c2c; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .phone {
      width: 375px; height: 750px; background: #1a1a1a; border-radius: 40px;
      padding: 12px; box-shadow: 0 0 0 3px #4a4a4a, 0 0 0 8px #1a1a1a, 0 20px 60px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
    }
    .notch {
      width: 130px; height: 28px; background: #1a1a1a;
      border-radius: 0 0 20px 20px; margin: -12px auto 8px;
    }
    .screen {
      flex: 1; background: #ededed; border-radius: 32px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .header {
      background: #ededed; padding: 12px 16px; text-align: center;
      border-bottom: 1px solid #ccc; font-weight: bold; font-size: 17px;
    }
    .chat-area {
      flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 18px;
      line-height: 1.4; word-break: break-word; animation: fadeIn 0.2s;
    }
    .user { align-self: flex-end; background: #95d469; color: #000; border-bottom-right-radius: 4px; }
    .oc { align-self: flex-start; background: #fff; color: #000; border-bottom-left-radius: 4px; }
    .input-area {
      display: flex; padding: 10px; background: #f7f7f7;
      border-top: 1px solid #ccc;
    }
    .input-area input {
      flex: 1; border: 1px solid #ccc; border-radius: 20px;
      padding: 10px 15px; outline: none; font-size: 16px;
    }
    .input-area button {
      margin-left: 8px; background: #07c160; color: white; border: none;
      border-radius: 50%; width: 40px; height: 40px; font-size: 20px;
      cursor: pointer;
    }
    .hint { text-align: center; font-size: 12px; color: #999; margin: 4px 0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="header">💬 和小鲸鱼聊天</div>
      <div class="chat-area" id="chatArea"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="说点什么..." autocomplete="off">
        <button onclick="send()">➤</button>
      </div>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');

    // 在这里修改你的 OC 设定！想改成谁都行。
    const SYSTEM_PROMPT = "你是一个名叫「小鲸鱼」的原创角色。你是一只肥嘟嘟的蓝色虎鲸，性格温柔、可爱，但很会倾听。你正在和你的创作者用手机聊天。请用亲切的语气回复，每次回复不要太长，像真人聊天一样。";

    let messages = [
      { role: "system", content: SYSTEM_PROMPT },
      { role: "assistant", content: "你好呀，我是小鲸鱼。很高兴能和你聊天~ 今天想聊什么呢？" }
    ];

    // --- 新增：保存对话到本地存储 ---
function saveMessages() {
  // 过滤掉系统消息（system prompt），只保存用户和助手的对话
  const toSave = messages.filter(m => m.role === 'user' || m.role === 'assistant');
  localStorage.setItem('oc_chat_history', JSON.stringify(toSave));
}

// --- 新增：从本地存储加载对话 ---
function loadMessages() {
  const saved = localStorage.getItem('oc_chat_history');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      // 确保是数组，并且里面是有效消息
      if (Array.isArray(parsed) && parsed.length > 0) {
        // 先把系统设定加到最前面
        messages = [
          { role: "system", content: SYSTEM_PROMPT },
          ...parsed
        ];
        // 把历史记录渲染到屏幕上
        chatArea.innerHTML = ''; // 清空（避免和初始消息重复）
        for (const msg of parsed) {
          addBubble(msg.content, msg.role === 'user' ? 'user' : 'oc');
        }
        return true; // 表示加载成功
      }
    } catch(e) {
      console.error('读取聊天记录失败', e);
    }
  }
  return false; // 没有记录或读取失败
}
    
    function addBubble(text, role) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'oc');
      bubble.textContent = text;
      chatArea.appendChild(bubble);
      chatArea.scrollTop = chatArea.scrollHeight;
      return bubble;
    }

    // 启动时显示第一条 OC 消息
    window.onload = () => {
  // 尝试从本地存储加载历史，如果没有才显示默认欢迎语
  if (!loadMessages()) {
    addBubble(messages[1].content, 'assistant');
  }
};

    // 是否正在生成回复（防止重复点击）
    let isGenerating = false;

    // 提示是否已显示过（只提示一次，不每条消息都提示）
    let hintShown = false;

    // 发送消息 / 触发 AI 回复：
    // - 输入框有内容 → 只把用户消息发出去，AI 不会立即回复
    // - 输入框空闲（空）→ 再点一次发送键，才调用 API 生成回复
    function send() {
      const text = userInput.value.trim();

      if (text) {
        // 有输入：只发送用户消息，不调用 API
        userInput.value = '';
        addBubble(text, 'user');
        messages.push({ role: "user", content: text });
        saveMessages();
        if (!hintShown) {
          hintShown = true;
          addHint('消息已发送 ~ 再点一次发送键让小鲸鱼回复你');
        }
        return;
      }

      // 输入框空闲：手动触发 AI 回复
      generateReply();
    }

    function addHint(text) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = text;
      chatArea.appendChild(hint);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function generateReply() {
      if (isGenerating) return;
      // 没有任何用户消息时，不调用 API
      if (!messages.some(m => m.role === 'user')) return;

      isGenerating = true;

      // 显示“对方正在输入...”
      const typingBubble = addBubble('...', 'oc');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) throw new Error('请求失败');

        // 处理流式输出
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        typingBubble.textContent = '';
        let done = false;

        while (!done) {
          const { value, done: streamDone } = await reader.read();
          done = streamDone;
          const chunk = decoder.decode(value, { stream: !done });
          // 简单解析 SSE 数据行
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.substring(6);
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content;
                if (content) typingBubble.textContent += content;
                chatArea.scrollTop = chatArea.scrollHeight;
              } catch (e) {}
            }
          }
        }

        // 记录完整的 AI 回复
        const fullReply = typingBubble.textContent;
        messages.push({ role: "assistant", content: fullReply });
        saveMessages(); // 保存到本地存储
      } catch (err) {
        typingBubble.textContent = '出了点问题，晚点再试试吧...';
        console.error(err);
      } finally {
        isGenerating = false;
      }
    }

    // 按回车发送
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
